<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Key Code Display</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        #key-display {
            font-size: 5rem;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
            min-height: 80px;
        }
        .info {
            color: #666;
            font-size: 1.2rem;
        }
        .code-display {
            font-size: 1.5rem;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Press Any Key</h1>
        <div id="key-display">Press any key</div>
        <div id="code-display" class="code-display"></div>
    </div>

    <script>
        document.addEventListener('keydown', function(event) {
            const keyDisplay = document.getElementById('key-display');
            const codeDisplay = document.getElementById('code-display');
            
            // Handle keys without a character representation
            const keyValue = event.key === ' ' ? 'Space' : 
                             event.key === '' ? 'Special Key' : 
                             event.key;
            
            keyDisplay.textContent = keyValue;
            codeDisplay.textContent = `Code: ${event.code}`;
        });
    </script>
